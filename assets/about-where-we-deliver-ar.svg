<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="wwd-title-ar wwd-desc-ar">
<title id="wwd-title-ar">أين نعمل: من عمّان إلى مشاريع عالمية</title>
<desc id="wwd-desc-ar">مقرّنا في عمّان، الأردن، نُنفّذ عن بُعد وعبر الإنترنت، لمؤسسات من مؤسسات إقليمية إلى شركات عالمية.</desc>

<rect x="1" y="1" width="898" height="218" rx="14" fill="#FFFFFF" stroke="#E2E6EA" stroke-width="1"/>

<text x="870" y="38" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="13" font-weight="700"
      fill="#C68E17">أين نُنفّذ — توضيحي</text>

<!-- Box 1 (rightmost, read first): Amman -->
<rect x="646" y="70" width="224" height="62" rx="10" fill="#0F2A4A"/>
<text x="758" y="96" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">مقرّنا في</text>
<text x="758" y="117" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">عمّان، الأردن</text>

<!-- Arrow 1 (pointing left) -->
<line x1="634" y1="101" x2="578" y2="101" stroke="#8992A0" stroke-width="2"/>
<polygon points="578,101 588,96 588,106" fill="#8992A0"/>

<!-- Box 2: Remote & Online (highlighted) -->
<rect x="342" y="70" width="224" height="62" rx="10" fill="#C68E17"/>
<text x="454" y="96" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">تنفيذ عن بُعد</text>
<text x="454" y="117" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">وعبر الإنترنت</text>

<!-- Arrow 2 (pointing left) -->
<line x1="330" y1="101" x2="274" y2="101" stroke="#8992A0" stroke-width="2"/>
<polygon points="274,101 284,96 284,106" fill="#8992A0"/>

<!-- Box 3 (leftmost, read last): Regional to Global -->
<rect x="30" y="70" width="232" height="62" rx="10" fill="#0F2A4A"/>
<text x="146" y="96" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">من مؤسسات إقليمية</text>
<text x="146" y="117" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">إلى شركات عالمية</text>

<text x="450" y="192" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="13.5" fill="#5B6B7C">نعمل مع مؤسسات ذات حجم فاعل — أينما كانت.</text>
</svg>
