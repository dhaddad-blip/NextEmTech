<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-labelledby="hero-agentic-title-ar" class="hero-agentic-graphic">
<title id="hero-agentic-title-ar">رسم تجريدي لعميل ذكاء اصطناعي مركزي ينسّق ثلاث مهام متصلة</title>

<!-- connector lines (mirrored) -->
<line x1="200" y1="60" x2="308" y2="32" stroke="#C9D3DD" stroke-width="2"/>
<line x1="200" y1="60" x2="308" y2="88" stroke="#C9D3DD" stroke-width="2"/>
<line x1="200" y1="60" x2="88" y2="60" stroke="#C9D3DD" stroke-width="2"/>

<!-- satellite nodes -->
<circle cx="318" cy="30" r="10" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2.5"/>
<circle cx="318" cy="90" r="10" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2.5"/>
<circle cx="78" cy="60" r="10" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="2.5"/>

<!-- central agent (hexagon, matches the logo mark) -->
<polygon points="200,38 222,50 222,74 200,86 178,74 178,50"
         fill="#FFFFFF" stroke="#0F2A4A" stroke-width="3.5"/>
<line x1="188" y1="48" x2="188" y2="76" stroke="#0F2A4A" stroke-width="4" stroke-linecap="round"/>
<line x1="212" y1="48" x2="212" y2="76" stroke="#0F2A4A" stroke-width="4" stroke-linecap="round"/>
<line x1="190" y1="75" x2="210" y2="49" stroke="#C68E17" stroke-width="5" stroke-linecap="round"/>
<circle cx="200" cy="38" r="3.5" fill="#C68E17"/>
</svg>
